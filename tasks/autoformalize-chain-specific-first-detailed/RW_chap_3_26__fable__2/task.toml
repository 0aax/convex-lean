[task]
name = "autoformalize-chain-specific-first-detailed/RW_chap_3_26__fable__2"
description = "Formalize Theorem 3.26 (Rockafellar & Wets, Variational Analysis) as a Lean 4 statement: definitions plus a sorried theorem."
keywords = ["lean4", "mathlib", "autoformalization", "convex-analysis", "RW"]

[metadata]
category = "autoformalization"
difficulty = "statement-only"
tags = ["lean4", "mathlib-4.28", "autoformalize", "RW"]
book = "RW"
result = "Theorem 3.26"
source = "Rockafellar & Wets, *Variational Analysis*, Chapter 3, Theorem 3.26 (horizon functions and coercivity)"
source_file = "variational_analysis.pdf"
source_pdf_page = 102
# The corpus statement this question is judged against (not shown to the agent).
reference_statement = "convex-eval-v28/RW_chap_3_26"
time_budget_sec = 1800.0
# Grading is by people; the verifier's reward only records whether the file has
# the required shape (builds, one sorried theorem of the right name).
human_judged = true
prior_module = "FCA_chap_B_3_2_4_ii"

[environment]
cpus = 4
memory_mb = 8192
storage_mb = 10240
force_build = false
allow_internet = true

[agent]
# The time budget is enforced here, identically for every agent. Harbor still
# runs the verifier after an agent timeout, so work on disk is graded.
timeout_sec = 1800.0

[verifier]
# One `lake build` of a single statement file plus a textual check.
timeout_sec = 1800.0

# Collect the Lake package and scratch directory, but not the 77 MB corpus.
[[artifacts]]
source = "/app"
exclude = ["*/.lake/*", "*/.lake", ".lake", "*/.lake/packages/*", "*/.lake/build/*",
           "*/.git/*", "*/venv/*", "*/.venv/*", "*/__pycache__/*",
           "*.olean", "*.ilean", "*.trace", "*.hash", "*.pack", "*.idx",
           "*/corpus/*", "*.pdf"]
