[task]
name = "convex-eval-v21-15m/saga_strongly_convex_distance_bound"
description = "Prove the Lean 4 theorem saga_strongly_convex_distance_bound."
keywords = ["lean4", "mathlib", "formal-proofs", "convex-analysis", "Alg"]

[metadata]
difficulty = "open"
category = "formal-theorem-proving"
tags = ["lean4", "mathlib-4.21", "Alg"]
book = "Alg"
source = "Defazio, Bach & Lacoste-Julien, 'SAGA: A Fast Incremental Gradient Method With Support for Non-Strongly Convex Composite Objectives' (NIPS 2014)"
proved_in_project = false
time_budget_sec = 900.0

[environment]
cpus = 4
memory_mb = 8192
storage_mb = 10240
force_build = false
allow_internet = true

[agent]
# The time budget is enforced here. The gated loop's gate_time_limit_sec is set
# to the same value, but it is only checked between turns, so one long turn
# could overrun it; this timeout is the hard stop. Harbor still runs the
# verifier after an agent timeout, so work on disk is graded.
timeout_sec = 900.0

[verifier]
# Rebuilds the agent's modules from scratch, then one comparator pass.
timeout_sec = 3600.0

[[artifacts]]
source = "/app"
exclude = ["*/.lake/*", "*/.git/*", "*/venv/*", "*/.venv/*", "*/__pycache__/*",
           "*.olean", "*.ilean", "*.trace", "*.hash", "*.pack", "*.idx"]
